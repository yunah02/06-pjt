{% extends 'base.html' %}

{% block content %}
<h1 class="h3 mb-1">쓰레드 수정</h1>
<p class="text-muted mb-4">도서: {{ thread.book.title }}</p>
<form action="{% url 'books:thread_update' thread.pk %}" method="POST">
  {% include 'books/_form.html' %}
  <button type="submit" class="btn btn-primary">수정</button>
  <a href="{% url 'books:thread_detail' thread.pk %}" class="btn btn-outline-secondary">취소</a>
</form>
{% endblock content %}
