{% extends 'base.html' %}

{% block content %}
<h1 class="h3 mb-1">쓰레드 작성</h1>
<p class="text-muted mb-4">도서: {{ book.title }}</p>
<form action="{% url 'books:thread_create' book.pk %}" method="POST">
  {% include 'books/_form.html' %}
  <button type="submit" class="btn btn-primary">작성</button>
  <a href="{% url 'books:detail' book.pk %}" class="btn btn-outline-secondary">취소</a>
</form>
{% endblock content %}
