{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">도서 목록</h1>
  {% if user.is_authenticated %}
    <a href="{% url 'books:create' %}" class="btn btn-primary">도서 작성</a>
  {% endif %}
</div>

<div class="list-group">
  {% for book in books %}
    <a href="{% url 'books:detail' book.pk %}" class="list-group-item list-group-item-action">
      <span class="fw-semibold">{{ book.title }}</span>
      <span class="text-muted small">· {{ book.author }} · 평점 {{ book.customer_review_rank }}</span>
    </a>
  {% empty %}
    <p class="text-muted">아직 등록된 도서가 없습니다.</p>
  {% endfor %}
</div>
{% endblock content %}
