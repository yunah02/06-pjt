{% extends 'base.html' %}

{% block content %}
  <h1>회원정보 수정</h1>
  <form action="{% url 'accounts:update' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <a href="{% url 'accounts:change_password' %}">비밀번호 변경</a>
    <div class="mt-3">
      <button type="submit" class="btn btn-success">저장</button>
    </div>
  </form>
{% endblock content %}
