<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThRead</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background-color: #1a8754;">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="#">ThRead</a>
      <ul class="navbar-nav ms-auto flex-row gap-3">
        {# books 링크는 B가 URL을 push한 뒤 {% url 'books:index' %}, {% url 'books:create' %}로 교체 #}
        <li class="nav-item"><a class="nav-link text-white" href="#">INDEX</a></li>
        {% if request.user.is_authenticated %}
          <li class="nav-item"><a class="nav-link text-white" href="#">CREATE</a></li>
          <li class="nav-item">
            <a class="nav-link text-white" href="{% url 'accounts:profile' request.user.username %}">MY PROFILE</a>
          </li>
          <li class="nav-item">
            <form action="{% url 'accounts:logout' %}" method="POST">
              {% csrf_token %}
              <button type="submit" class="nav-link text-white bg-transparent border-0">LOGOUT</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link text-white" href="{% url 'accounts:login' %}">LOGIN</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{% url 'accounts:signup' %}">SIGNUP</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
