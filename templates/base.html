
<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}ThRead{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg tr-navbar">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand tr-brand" href="{% url 'books:index' %}">
        <span class="brand-icon">📖</span>
        <span>ThRead</span>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarMenu"
              aria-controls="navbarMenu"
              aria-expanded="false"
              aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'books:index' %}">INDEX</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'accounts:people' %}">PEOPLE</a>
          </li>
          {% if request.user.is_authenticated %}

            <li class="nav-item">
              <a class="nav-link" href="{% url 'books:create' %}">CREATE</a>
            </li>

            <li class="nav-item">
              <a class="nav-link"
                 href="{% url 'accounts:profile' request.user.username %}">MY PROFILE</a>
            </li>

            <li class="nav-item">
              <form action="{% url 'accounts:logout' %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="nav-link nav-login-btn">LOGOUT</button>
              </form>
            </li>
          {% else %}

            <li class="nav-item">
              <a class="nav-link nav-login-btn"
                 href="{% url 'accounts:login' %}">LOGIN</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:signup' %}">SIGNUP</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  <main class="container page-container">
    {% block content %}
    {% endblock content %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
